name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, Set-up-CI-Pipeline-CM]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test and quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Hello from the frontend CI workflow!"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration

  build:
    name: Build container image
    needs: test
    runs-on: ubuntu-latest
    env:
      ACR_LOGIN_SERVER: acraiacademy26.azurecr.io
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Azure
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Set-up-CI-Pipeline-CM')
        uses: azure/login@v2
        with:
          creds: >-
            {"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}
      - name: Log in to Azure Container Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Set-up-CI-Pipeline-CM')
        run: az acr login --name acraiacademy26
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: ${{ env.ACR_LOGIN_SERVER }}/team1-frontend:test-${{ github.sha }}
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Set-up-CI-Pipeline-CM') }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
